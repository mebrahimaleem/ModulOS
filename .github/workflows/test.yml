name: Run test suite
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          sudo apt update
          sudo apt install clang-19 lld-19 llvm-19 grub-efi-amd64-bin mtools meson ninja-build
          sudo ln -s -f /usr/bin/lld-19 /usr/bin/lld
          sudo ln -s -f /usr/bin/ld.lld-19 /usr/bin/ld.lld

      - name: Build ModulOS
        run: |
          make build

      - name: Run test suite
        run: |
          make test-all | tee build/test-log.txt

      - name: Archive debugging symbols
        uses: actions/upload-artifact@v4
        with:
          name: dbg-symbols
          path: build/modulos-dbg
          retention-days: 2

      - name: Archive testsuite log
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-log
          path: build/test-log.txt
          retention-days: 2
